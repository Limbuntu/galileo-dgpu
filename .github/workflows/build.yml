name: Build images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        image: [terminal, browser, workstation, dosbox, nvidia]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build builder image
        run: docker build -t galileo-builder .

      - name: Build ${{ matrix.image }} image
        run: |
          mkdir -p out
          docker run --rm -v $PWD:/build -v $PWD/out:/out -w /build \
            -e FORCE_UNSAFE_CONFIGURE=1 \
            galileo-builder \
            sh -c 'git config --global --add safe.directory /build && \
                   make O=/out/${{ matrix.image }} BR2_DL_DIR=/out/dl galileo_${{ matrix.image }}_defconfig && \
                   make O=/out/${{ matrix.image }} BR2_DL_DIR=/out/dl -j$(nproc) && \
                   gzip -9 /out/${{ matrix.image }}/images/sdcard.img'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-sdcard.img.gz
          path: out/${{ matrix.image }}/images/sdcard.img.gz
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*/*.img.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
