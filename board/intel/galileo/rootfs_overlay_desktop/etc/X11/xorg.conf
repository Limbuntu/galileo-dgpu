Section "ServerFlags"
    Option "BlankTime" "20"
    Option "StandbyTime" "20"
    Option "SuspendTime" "20"
    Option "OffTime" "20"
EndSection

Section "Module"
	Load "glx"
    Load "exa"
	Load "shadow"
	Load "fb"
EndSection
# Minimal Xorg config for the Galileo + RX 580 / HD 6450 build.
# No udev on this system (mdev): input devices are wired explicitly.

Section "Device"
	Identifier  "GPU0"
	Driver      "modesetting"
	Option      "AccelMethod" "glamor"
EndSection

Section "Monitor"
	Identifier  "MON0"
EndSection

Section "Screen"
	Identifier  "SCREEN0"
	Device      "GPU0"
	Monitor     "MON0"
	DefaultDepth 24
	SubSection "Display"
		Depth 24
		Modes "1280x1024"
	EndSubSection
EndSection

Section "InputDevice"
	Identifier  "KBD0"
	Driver      "kbd"
	Option      "CoreKeyboard"
EndSection

Section "InputDevice"
	Identifier  "MOU0"
	Driver      "mouse"
	Option      "Device" "/dev/input/mice"
	Option      "Protocol" "ImPS/2"
	Option      "CorePointer"
EndSection

Section "ServerLayout"
	Identifier  "LAYOUT"
	Screen      "SCREEN0"
	InputDevice "KBD0"
	InputDevice "MOU0"
	Option      "AutoAddDevices" "false"
EndSection
