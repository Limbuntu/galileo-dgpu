Section "ServerFlags"
    Option     "BlankTime" "0"
    Option     "StandbyTime" "0"
    Option     "SuspendTime" "0"
    Option     "OffTime" "0"
EndSection

# Universal Xorg config: works with amdgpu (RX 580), radeon (HD 6450),
# nouveau (TITAN X) via modesetting + glamor. No udev (mdev): inputs wired.

Section "Module"
    Load "glx"
    Load "glamoregl"
    Load "shadow"
    Load "fb"
EndSection

Section "Device"
	Identifier  "GPU0"
	Driver      "modesetting"
	Option      "AccelMethod" "glamor"
EndSection

Section "Monitor"
	Identifier  "MON0"
	Option      "PreferredMode" "1280x1024"
EndSection

Section "Screen"
	Identifier  "SCREEN0"
	Device      "GPU0"
	Monitor     "MON0"
	DefaultDepth 24
	SubSection "Display"
		Depth 24
		Modes "1280x1024"
	EndSubSection
EndSection

Section "InputDevice"
	Identifier  "KBD0"
	Driver      "kbd"
	Option      "CoreKeyboard"
EndSection

Section "InputDevice"
	Identifier  "MOU0"
	Driver      "mouse"
	Option      "Device" "/dev/input/mice"
	Option      "Protocol" "ImPS/2"
	Option      "CorePointer"
EndSection

Section "ServerLayout"
	Identifier  "LAYOUT"
	Screen      "SCREEN0"
	InputDevice "KBD0"
	InputDevice "MOU0"
	Option      "AutoAddDevices" "false"
EndSection
